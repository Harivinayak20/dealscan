<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Monogram D with scan line -->
  <rect x="16" y="24" width="10" height="72" rx="3" fill="#202823"/>
  <path d="M26 24H58C76 24 86 38 86 60C86 82 76 96 58 96H26V24Z" fill="#f7f2ea" stroke="#123d33" stroke-width="4"/>
  <!-- scan line accent -->
  <line x1="20" y1="60" x2="80" y2="60" stroke="#c9a86a" stroke-width="2" opacity="0.6" stroke-dasharray="3 6"/>
  <!-- diamond accent -->
  <polygon points="42,72 48,78 54,72 48,66" fill="#c9a86a"/>
  <!-- text -->
  <text x="104" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#202823" letter-spacing="-0.5">deal</text>
  <text x="104" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#123d33" letter-spacing="-0.5">scan</text>
  <!-- italic accent dot -->
  <text x="187" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="900" fill="#c9a86a" font-style="italic">.</text>
</svg>
