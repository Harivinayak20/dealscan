<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Speedometer gauge -->
  <path d="M26 66A36 36 0 0 1 74 30" stroke="#ebe4d8" stroke-width="6" stroke-linecap="round"/>
  <path d="M26 66A36 36 0 0 1 74 30" stroke="#b7603a" stroke-width="6" stroke-dasharray="70 140" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="50" y1="66" x2="62" y2="44" stroke="#c9a86a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="66" r="4" fill="#c9a86a"/>
  <!-- score badge -->
  <text x="42" y="72" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" fill="#b7603a" text-anchor="middle">92</text>
  <!-- text -->
  <text x="100" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#202823" letter-spacing="-0.5">deal</text>
  <text x="100" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#b7603a" letter-spacing="-0.5">scan</text>
  <!-- tagline -->
  <text x="100" y="98" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#c9a86a" letter-spacing="3" font-weight="600">KNOW THE SCORE</text>
</svg>
